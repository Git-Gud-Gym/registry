name: Validate

# Every change to the module list must still produce a valid catalog.
on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Build catalog.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/build-catalog.mjs --out public/catalog.json && cat public/catalog.json
